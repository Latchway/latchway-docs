name: Documentation PR policy

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: docs-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reason:
    name: Require a written docs-not-required reason
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Check documentation disposition
        run: >-
          python3 scripts/check-docs-pr-policy.py
          --event "$GITHUB_EVENT_PATH"
