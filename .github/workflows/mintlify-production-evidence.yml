name: Mintlify production evidence

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Exact GitHub deployment ID created by the Mintlify GitHub App
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mintlify-production-evidence-${{ github.event.deployment.id || inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  observe:
    name: Prove the production deployment and live documentation
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.deployment.creator.id == 109931778 &&
        github.event.deployment.environment == 'production' &&
        github.event.deployment_status.state == 'success'))
    runs-on: ubuntu-24.04
    environment: documentation-production-evidence
    timeout-minutes: 30
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      deployments: read
      id-token: write
    steps:
      - name: Resolve the immutable GitHub deployment authority
        id: deployment
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_DEPLOYMENT_ID: ${{ github.event.deployment.id }}
          INPUT_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          deployment_id="$INPUT_DEPLOYMENT_ID"
          if [[ "$EVENT_NAME" == deployment_status ]]; then
            deployment_id="$EVENT_DEPLOYMENT_ID"
          fi
          [[ "$deployment_id" =~ ^[1-9][0-9]*$ ]]
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/deployments/$deployment_id" \
            > "$RUNNER_TEMP/mintlify-deployment.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses?per_page=100" \
            > "$RUNNER_TEMP/mintlify-deployment-statuses.json"
          documentation_commit=$(jq --raw-output '.sha' "$RUNNER_TEMP/mintlify-deployment.json")
          [[ "$documentation_commit" =~ ^[0-9a-f]{40}$ ]]
          jq --exit-status \
            --argjson deployment_id "$deployment_id" \
            --arg commit "$documentation_commit" '
              .id == $deployment_id and .sha == $commit and .ref == "main" and
              .task == "deploy" and .environment == "production" and
              .production_environment == true and .transient_environment == false and
              .creator.id == 109931778 and .creator.login == "mintlify[bot]" and
              .creator.type == "Bot"
            ' "$RUNNER_TEMP/mintlify-deployment.json" >/dev/null
          {
            echo "deployment_id=$deployment_id"
            echo "documentation_commit=$documentation_commit"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the exact deployed documentation commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.deployment.outputs.documentation_commit }}
          persist-credentials: false

      - name: Revalidate the source and production-proof implementation
        shell: bash
        env:
          DOCUMENTATION_COMMIT: ${{ steps.deployment.outputs.documentation_commit }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse --verify HEAD)" = "$DOCUMENTATION_COMMIT"
          python3 scripts/check-source-manifest.py
          python3 -m unittest scripts/test_check_source_manifest.py
          python3 -m unittest scripts/test_mintlify_production_evidence.py
          python3 -m py_compile scripts/mintlify-production-evidence.py
          python3 -m json.tool schemas/mintlify-production-evidence.schema.json >/dev/null

      - name: Observe the live production site
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
          DOCUMENTATION_COMMIT: ${{ steps.deployment.outputs.documentation_commit }}
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/mintlify-production-evidence"
          mkdir -m 0700 "$evidence"
          python3 scripts/mintlify-production-evidence.py observe \
            --repository-root "$GITHUB_WORKSPACE" \
            --deployment-json "$RUNNER_TEMP/mintlify-deployment.json" \
            --statuses-json "$RUNNER_TEMP/mintlify-deployment-statuses.json" \
            --deployment-id "$DEPLOYMENT_ID" \
            --documentation-commit "$DOCUMENTATION_COMMIT" \
            --workflow-event "$GITHUB_EVENT_NAME" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-head-sha "$GITHUB_SHA" \
            --output "$evidence/latchway-mintlify-production-evidence.json"
          python3 scripts/mintlify-production-evidence.py verify \
            --evidence "$evidence/latchway-mintlify-production-evidence.json" \
            --deployment-id "$DEPLOYMENT_ID" \
            --documentation-commit "$DOCUMENTATION_COMMIT"
          (
            cd "$evidence"
            sha256sum latchway-mintlify-production-evidence.json \
              > latchway-mintlify-production-evidence.SHA256SUMS
          )

      - name: Attest the exact production evidence
        id: attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/mintlify-production-evidence/latchway-mintlify-production-evidence.json

      - name: Retain the attestation bundle with the evidence
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attestation.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          test -f "$BUNDLE_PATH"
          cp -- "$BUNDLE_PATH" \
            "$RUNNER_TEMP/mintlify-production-evidence/latchway-mintlify-production-evidence.attestation.sigstore.json"

      - name: Close the retained artifact set
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/mintlify-production-evidence"
          test -z "$(find "$evidence" -type l -print -quit)"
          actual=$(find "$evidence" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          expected=$(printf '%s\n' \
            latchway-mintlify-production-evidence.SHA256SUMS \
            latchway-mintlify-production-evidence.attestation.sigstore.json \
            latchway-mintlify-production-evidence.json | LC_ALL=C sort)
          test "$actual" = "$expected"
          test "$(find "$evidence" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          (
            cd "$evidence"
            sha256sum --check latchway-mintlify-production-evidence.SHA256SUMS
          )

      - name: Upload immutable Mintlify production evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: latchway-mintlify-production-${{ steps.deployment.outputs.documentation_commit }}-${{ steps.deployment.outputs.deployment_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mintlify-production-evidence
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
