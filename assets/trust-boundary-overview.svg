<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="trust-title trust-description">
  <title id="trust-title">Independent trust inputs at the Latchway boundary</title>
  <desc id="trust-description">An untrusted client presents an identity token, platform or web trust evidence, and a fresh DPoP proof. Separate verifiers normalize these inputs before server-owned feature policy can authorize a bounded session.</desc>
  <style>
    :root { --ink:#14213d; --muted:#526079; --surface:#ffffff; --panel:#eef3ff; --accent:#3157d5; --good:#0f766e; --line:#8ca0c8; }
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:var(--ink); }
    .label { font-size:16px; font-weight:700; } .small { font-size:13px; fill:var(--muted); }
    .node { fill:var(--surface); stroke:var(--line); stroke-width:2; } .verify { fill:var(--panel); stroke:var(--accent); stroke-width:2; }
    .boundary { fill:none; stroke:var(--accent); stroke-width:3; stroke-dasharray:10 8; } .flow { fill:none; stroke:var(--accent); stroke-width:3; marker-end:url(#trust-arrow); } .result { stroke:var(--good); }
    @media (prefers-color-scheme: dark) { :root { --ink:#f2f5ff; --muted:#b8c3db; --surface:#131b2e; --panel:#1c2b55; --accent:#8fa8ff; --good:#5eead4; --line:#60739c; } }
    @media (forced-colors: active) { .node,.verify { fill:Canvas; stroke:CanvasText; } .boundary,.flow { stroke:LinkText; } text { fill:CanvasText; } }
  </style>
  <defs><marker id="trust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke"/></marker></defs>

  <text x="42" y="38" class="label">Untrusted client</text><text x="422" y="38" class="label">Latchway verification boundary</text>
  <line x1="364" y1="52" x2="364" y2="375" class="boundary"/>
  <rect x="38" y="76" width="270" height="70" rx="15" class="node"/><text x="62" y="106" class="label">Identity token</text><text x="62" y="129" class="small">Configured issuer and audience</text>
  <rect x="38" y="177" width="270" height="70" rx="15" class="node"/><text x="62" y="207" class="label">Trust evidence</text><text x="62" y="230" class="small">Native attestation or web-risk signal</text>
  <rect x="38" y="278" width="270" height="70" rx="15" class="node"/><text x="62" y="308" class="label">Fresh DPoP proof</text><text x="62" y="331" class="small">Component key, method, and public URL</text>

  <rect x="414" y="76" width="250" height="70" rx="15" class="verify"/><text x="438" y="106" class="label">Authenticate identity</text><text x="438" y="129" class="small">Normalize application user</text>
  <rect x="414" y="177" width="250" height="70" rx="15" class="verify"/><text x="438" y="207" class="label">Evaluate trust</text><text x="438" y="230" class="small">Normalize provenance and level</text>
  <rect x="414" y="278" width="250" height="70" rx="15" class="verify"/><text x="438" y="308" class="label">Verify possession</text><text x="438" y="331" class="small">Reject replay or destination drift</text>
  <path d="M308 111 H406" class="flow"/><path d="M308 212 H406" class="flow"/><path d="M308 313 H406" class="flow"/>

  <rect x="748" y="132" width="215" height="160" rx="18" class="node"/><text x="855" y="165" text-anchor="middle" class="label">Feature policy</text><text x="855" y="190" text-anchor="middle" class="small">Requires all independent</text><text x="855" y="211" text-anchor="middle" class="small">inputs at configured levels</text><path d="M774 231 H936" class="boundary"/><text x="855" y="257" text-anchor="middle" class="label">Bounded session</text><text x="855" y="278" text-anchor="middle" class="small">Server-owned authorization</text>
  <path d="M664 111 C710 111 708 166 741 180" class="flow result"/><path d="M664 212 H741" class="flow result"/><path d="M664 313 C710 313 708 258 741 244" class="flow result"/>
  <text x="38" y="400" class="small">Identity is not attestation. Attestation is not authorization. DPoP proves key possession—not safe code or hardware.</text>
</svg>
