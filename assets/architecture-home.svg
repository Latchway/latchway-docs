<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">Latchway request architecture</title>
  <desc id="architecture-description">A client sends identity, trust evidence, and a DPoP proof to Latchway. Latchway authenticates, authorizes, enforces quotas, records authoritative state in PostgreSQL, and selects an AI upstream without returning provider credentials.</desc>
  <style>
    :root { --ink:#14213d; --muted:#526079; --surface:#ffffff; --panel:#eef3ff; --accent:#3157d5; --accent2:#0f766e; --line:#8ca0c8; --warn:#b45309; }
    text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:var(--ink); }
    .label { font-size:16px; font-weight:700; } .small { font-size:13px; fill:var(--muted); }
    .panel { fill:var(--surface); stroke:var(--line); stroke-width:2; } .soft { fill:var(--panel); stroke:var(--accent); stroke-width:2; }
    .flow { fill:none; stroke:var(--accent); stroke-width:3; marker-end:url(#architecture-arrow); } .state { stroke:var(--accent2); }
    @media (prefers-color-scheme: dark) { :root { --ink:#f2f5ff; --muted:#b8c3db; --surface:#131b2e; --panel:#1c2b55; --accent:#8fa8ff; --accent2:#5eead4; --line:#60739c; --warn:#fdba74; } }
    @media (forced-colors: active) { .panel,.soft { fill:Canvas; stroke:CanvasText; } .flow { stroke:LinkText; } text { fill:CanvasText; } }
  </style>
  <defs><marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>

  <text x="46" y="40" class="label">Client application</text>
  <rect x="35" y="58" width="225" height="292" rx="18" class="panel"/>
  <rect x="58" y="88" width="179" height="58" rx="12" class="soft"/>
  <text x="78" y="114" class="label">Identity token</text><text x="78" y="134" class="small">Who is signed in</text>
  <rect x="58" y="166" width="179" height="58" rx="12" class="soft"/>
  <text x="78" y="192" class="label">Trust evidence</text><text x="78" y="212" class="small">App or web signal</text>
  <rect x="58" y="244" width="179" height="78" rx="12" class="soft"/>
  <text x="78" y="270" class="label">Component key</text><text x="78" y="291" class="small">Fresh DPoP proof</text><text x="78" y="310" class="small">for method and URL</text>

  <text x="381" y="40" class="label">Latchway security and policy boundary</text>
  <rect x="328" y="58" width="360" height="292" rx="18" class="panel"/>
  <rect x="355" y="88" width="306" height="48" rx="11" class="soft"/><text x="376" y="118" class="label">Authenticate + verify trust + DPoP</text>
  <path d="M508 136 V158" class="flow"/>
  <rect x="355" y="164" width="306" height="48" rx="11" class="soft"/><text x="376" y="194" class="label">Authorize feature policy</text>
  <path d="M508 212 V234" class="flow"/>
  <rect x="355" y="240" width="144" height="72" rx="11" class="soft"/><text x="376" y="269" class="label">Reserve quota</text><text x="376" y="291" class="small">Exact request guards</text>
  <rect x="517" y="240" width="144" height="72" rx="11" class="soft"/><text x="538" y="269" class="label">Select route</text><text x="538" y="291" class="small">Fallback policy</text>
  <path d="M499 276 H511" class="flow"/>

  <rect x="750" y="58" width="215" height="112" rx="18" class="panel"/>
  <text x="778" y="92" class="label">AI upstream</text><text x="778" y="116" class="small">Server-held credential</text><text x="778" y="138" class="small">Streaming response</text>
  <rect x="750" y="238" width="215" height="112" rx="18" class="panel"/>
  <text x="778" y="272" class="label">PostgreSQL 15+</text><text x="778" y="296" class="small">Sessions, replay, quotas</text><text x="778" y="318" class="small">usage, audit, jobs, config</text>

  <path d="M260 204 H321" class="flow"/>
  <path d="M661 276 C710 276 700 114 743 114" class="flow"/>
  <path d="M688 300 H743" class="flow state"/>
  <path d="M858 170 V231" class="flow"/>
  <text x="283" y="191" class="small">HTTPS</text>
  <text x="35" y="395" class="small">The client chooses a feature—not a provider credential, route, price, or trusted identity.</text>
</svg>
